:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f6f7fb;background:#050609;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#2c210d 0,transparent 38%),#050609;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f8d16a;outline-offset:3px}.shell{max-width:780px;margin:auto;min-height:100vh;padding:14px 13px 34px}.frame{border:1px solid #b98a28;border-radius:24px;box-shadow:0 0 20px #9c671b30, inset 0 0 0 1px #f2b82c33;padding:15px;background:linear-gradient(145deg,#080a0d,#050608)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #9d792e;padding:6px 0 17px;margin-bottom:17px}.brand{font-size:clamp(19px,4.5vw,29px);font-weight:850;letter-spacing:-1px;font-style:italic}.brand em{color:#f7b52d;font-style:italic}.brandmark{font-size:11px;line-height:1.1;letter-spacing:1.5px;color:#f3c15b;font-weight:900;border-bottom:2px solid #c89528;padding:3px;min-width:67px;text-align:center}.beta{border:1px solid #ad832b;border-radius:24px;font-size:9px;padding:7px;white-space:nowrap}.heading{text-align:center;padding:12px 0 23px;background:linear-gradient(140deg,#131720,#06080c);border-radius:18px;margin-bottom:16px}.heading h1{font-size:clamp(25px,6vw,36px);font-style:italic;margin:2px}.muted{color:#adb3c0}.heading p{margin:5px;font-size:13px}.goldline{width:120px;height:2px;background:linear-gradient(90deg,transparent,#ffc74b,transparent);margin:16px auto 0}.sports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sport{display:flex;align-items:center;gap:11px;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,#12151d),#11141a 72%);border:1px solid #49505e;border-left:2px solid var(--accent);border-radius:17px;min-height:93px;padding:12px 10px;box-shadow:inset 0 0 20px color-mix(in srgb,var(--accent) 12%,transparent)}.sport .emoji{font-size:31px;flex:0 0 38px;text-align:center}.sport strong{font-size:clamp(14px,3.4vw,19px);display:block}.sport small{color:#abb2c0;font-size:12px}.chev{margin-left:auto;color:#edb64e}.panel{background:linear-gradient(145deg,#1b2029,#0e1117);border:1px solid #5a4b30;border-radius:17px;padding:14px;margin-top:17px}.panel h2{font-size:19px;margin:0 0 10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{border:0;border-right:1px solid #67532c;background:none;padding:8px 3px;font-size:12px}.quick button:last-child{border:0}.back{background:linear-gradient(#242932,#11141a);border:1px solid #414a59;border-radius:14px;padding:11px 15px;margin-bottom:15px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px;scrollbar-width:none}.nav button,.tabs button{background:linear-gradient(#252b35,#0b0d11);border:1px solid #3e4653;border-radius:25px;padding:11px 15px;white-space:nowrap;font-size:13px;font-weight:700}.nav .active,.tabs .active{border-color:#1bafff;box-shadow:0 0 12px #007dff;color:white;background:linear-gradient(#0759a2,#071426)}.hero{border-radius:18px;min-height:154px;padding:23px 19px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 55%,#071222),#061020 80%);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero:after{content:' ';position:absolute;right:-60px;top:-50px;width:220px;height:220px;border:30px solid #ffffff0b;transform:rotate(45deg)}.hero strong{font-size:34px;font-style:italic;z-index:1}.hero span{font-size:13px;z-index:1}.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0;scrollbar-width:none}.section-title{font-size:19px;font-weight:800;margin:8px 0 3px}.subtitle{color:#adb5c5;font-size:12px;margin:0 0 12px}.game-row{width:100%;text-align:left;background:linear-gradient(120deg,#222935,#11151c);border:1px solid #394453;border-radius:16px;margin:10px 0;padding:12px}.rowtop{display:flex;align-items:center;gap:10px}.rank{border:1px solid #d7a22b;border-radius:8px;color:#ffd05c;font-size:20px;font-weight:900;padding:4px 9px}.team{font-weight:800;font-size:15px;flex:1}.date{font-size:12px;color:#b6bfce;margin-top:3px}.score{border-top:1px solid #364150;margin-top:10px;padding-top:9px;color:#cbd3df;font-size:12px}.prob{color:#f7c45e;font-weight:800;font-size:12px}.versus{display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(120deg,var(--left),#082347 45%,var(--right));border-radius:17px;padding:26px 12px;min-height:174px}.versus .logo{font-size:50px}.versus strong{font-size:20px}.versus small{font-size:12px;color:#e5e9f2}.center{text-align:center}.result{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.result .panel{margin:0;padding:13px}.result strong{font-size:20px}.winner{border-color:#1589df!important;background:linear-gradient(130deg,#064d91,#0b1829)!important}.gold{color:#f4c25a}.scoreboard{display:flex;justify-content:space-around;align-items:center;gap:10px;margin-top:8px}.scoreboard span{padding:10px;border-radius:9px;background:#11243c;font-weight:900;font-size:22px}.analysis{padding-left:21px;line-height:1.55;font-size:14px}.analysis li{margin:8px 0}.note{font-size:12px;color:#c3a66a;line-height:1.5;margin:14px 0}.hidden{display:none!important}@media(max-width:430px){.shell{padding:8px}.frame{padding:11px}.sport{min-height:80px;gap:6px}.sport .emoji{font-size:25px;flex-basis:31px}.sport strong{font-size:13px}.brand{font-size:20px}.beta{font-size:8px}.team{font-size:13px}.versus .logo{font-size:38px}.result strong{font-size:17px}}

</style></head><body><main class="shell"><div class="frame"><header><div class="brandmark">◉ CURRENTS<span style="color:white">CY</span><br>PICKS</div><div class="brand">Currentscy <em>Picks</em></div><div class="beta">FREE DATA BETA</div></header><div id="view"></div></div></main>
<script>
const sports=[{id:'nfl',name:'NFL',emoji:'🏈',color:'#0078ef',cadence:'Weekly Picks'},{id:'nba',name:'NBA',emoji:'🏀',color:'#a42bda',cadence:'Daily Picks'},{id:'ncaa',name:'NCAA Football',emoji:'🏈',color:'#ed304c',cadence:'Weekly Picks'},{id:'nhl',name:'NHL',emoji:'🏒',color:'#a4b0c0',cadence:'Daily Picks'},{id:'mlb',name:'MLB',emoji:'⚾',color:'#237bdc',cadence:'Daily Picks'},{id:'soccer',name:'Soccer',emoji:'⚽',color:'#1cba51',cadence:'Daily Picks'},{id:'tennis',name:'Tennis',emoji:'🎾',color:'#b0e12a',cadence:'Daily Picks'},{id:'ufc',name:'UFC',emoji:'🥊',color:'#e63838',cadence:'Fight Picks'}];
const examples={nfl:[['Buffalo Bills','Miami Dolphins','BUF','MIA'],['Kansas City Chiefs','Arizona Cardinals','KC','ARI'],['Chicago Bears','New Orleans Saints','CHI','NO'],['Detroit Lions','Tampa Bay Buccaneers','DET','TB'],['Denver Broncos','Las Vegas Raiders','DEN','LV']],nba:[['Boston Celtics','New York Knicks','BOS','NYK'],['Los Angeles Lakers','Golden State Warriors','LAL','GSW']],ncaa:[['Ohio State','Michigan','OSU','MICH']],nhl:[['New York Rangers','Boston Bruins','NYR','BOS']],mlb:[['Los Angeles Dodgers','San Diego Padres','LAD','SD']],soccer:[['Arsenal','Chelsea','ARS','CHE']],tennis:[['Player A','Player B','A','B']],ufc:[['Fighter A','Fighter B','A','B']]};
sports.push({id:'ncaab',name:'NCAA Basketball',emoji:'🏀',color:'#c67b20',cadence:'Daily Picks'});const adapters={nfl:'football/nfl',nba:'basketball/nba',ncaa:'football/college-football',ncaab:'basketball/mens-college-basketball',nhl:'hockey/nhl',mlb:'baseball/mlb',soccer:'soccer/eng.1'};const scheduleCache={};const phaseInterfaces=['ingestion','source-validation','identity-reconciliation','evidence-ledger','features','simulation','calibration','forecast-archive','monitoring','promotion'];async function fetchSchedule(id){if(!adapters[id])return [];const url='https://site.api.espn.com/apis/site/v2/sports/'+adapters[id]+'/scoreboard?dates='+new Date().toISOString().slice(0,10).replaceAll('-','')+'&limit=100';const response=await fetch(url);if(!response.ok)throw Error('Schedule source unavailable');const json=await response.json();return (json.events||[]).map(e=>({id:e.id,name:e.name,date:e.date,status:e.status?.type?.description||'Scheduled',competitors:e.competitions?.[0]?.competitors||[]}));}let state={page:'home',sport:'nfl',game:0,tab:'Prediction',sportTab:'Top 5 Winners'};
const getSport=()=>sports.find(s=>s.id===state.sport);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){return '<section class="heading"><h1>Choose Your Sport</h1><p class="muted">Live matchups, research &amp; matchup-based predictions</p><div class="goldline"></div></section><section class="sports">'+sports.map(s=>'<button class="sport" style="--accent:'+s.color+'" data-sport="'+s.id+'"><span class="emoji">'+s.emoji+'</span><span><strong>'+s.name+'</strong><small>'+s.cadence+'</small></span><span class="chev">›</span></button>').join('')+'</section><section class="panel"><h2>🏆 Today’s Top Picks</h2><div class="quick">'+['nfl','nba','ncaa'].map(id=>'<button data-sport="'+id+'">'+sports.find(s=>s.id===id).emoji+' '+sports.find(s=>s.id===id).name+'<br><small>Top 5 Winners</small></button>').join('')+'</div></section><p class="note">Live schedules where available. Verified predictions are pending integration.</p>'}
function sportPage(){const sp=getSport(),games=scheduleCache[sp.id]||[];return '<nav class="nav"><button data-home>⌂ Home</button>'+sports.map(x=>'<button data-sport="'+x.id+'" class="'+(x.id===sp.id?'active':'')+'">'+x.emoji+' '+x.name+'</button>').join('')+'</nav><section class="hero" style="--accent:'+sp.color+'"><strong>'+sp.emoji+' '+sp.name+'</strong><span>Predictions · Matchups · Player Picks · Game Analysis</span></section><div class="tabs">'+['All Games','Top 5 Winners','Player Picks','Trends'].map(t=>'<button data-stab="'+t+'" class="'+(state.sportTab===t?'active':'')+'">'+t+'</button>').join('')+'</div><h2 class="section-title">'+sp.name+' · '+esc(state.sportTab)+'</h2><p class="subtitle" id="status">Live schedules where supported · predictions require verified evidence</p>'+(state.sportTab==='All Games'?(!games.length?'<section class="panel">Loading schedule or no games listed for today.</section>':games.map((g,i)=>'<button class="game-row" data-game="'+i+'"><div class="rowtop"><span class="rank">'+(i+1)+'</span><span class="team">'+esc(g.name)+'<div class="date">'+esc(new Date(g.date).toLocaleString())+' · '+esc(g.status)+'</div></span><span class="prob">View →</span></div></button>').join('')):'<section class="panel">Verified '+esc(state.sportTab.toLowerCase())+' evidence is not yet connected. No fabricated projections.</section>')+'<p class="note">Game schedules are sourced separately from predictions. Phase 1–10 interfaces are reserved for integration.</p>'}function gamePage(){const sp=getSport(),g=(scheduleCache[sp.id]||[])[state.game];if(!g)return '<button class="back" data-sport="'+sp.id+'">‹ Back</button><section class="panel">Game unavailable</section>';const cs=g.competitors||[],away=cs.find(x=>x.homeAway==='away')||cs[0]||{},home=cs.find(x=>x.homeAway==='home')||cs[1]||{},name=x=>x.team?.displayName||'Unknown team',logo=x=>x.team?.logo?'<img alt="" style="width:58px;height:58px;object-fit:contain" src="'+esc(x.team.logo)+'">':'🏆';return '<button class="back" data-sport="'+sp.id+'">‹ All '+sp.name+' Games</button><section class="versus" style="--left:'+sp.color+';--right:#07505d"><div class="center">'+logo(away)+'<br><strong>'+esc(name(away))+'</strong></div><div class="center"><strong>VS</strong><br><small>'+esc(new Date(g.date).toLocaleString())+'</small></div><div class="center">'+logo(home)+'<br><strong>'+esc(name(home))+'</strong></div></section><div class="tabs">'+['Prediction','Matchup','Players','Injuries','Stats'].map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'">'+t+'</button>').join('')+'</div><section class="panel"><h2>'+esc(state.tab)+'</h2><p>Game ID: '+esc(g.id)+'</p><p>Schedule status: '+esc(g.status)+'</p><p>Verified player evidence, injuries, matchup analysis and calibrated predictions will appear here after their adapters are connected.</p><p class="note">No invented win probabilities or projected scores.</p></section><section class="panel"><h2>5-Leg Player Parlay</h2><p>Awaiting verified records for both teams.</p></section>'}function render(){document.getElementById('view').innerHTML=state.page==='home'?home():state.page==='sport'?sportPage():gamePage();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{state.page='home';render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;state.page='sport';state.sportTab='All Games';render();fetchSchedule(state.sport).then(g=>{scheduleCache[state.sport]=g;render()}).catch(e=>{const el=document.getElementById('status');if(el)el.textContent='Schedule unavailable: '+e.message})});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=Number(b.dataset.game);state.page='game';state.tab='Prediction';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{state.sportTab=b.dataset.stab;render()});}
render();
</script></body></html>
