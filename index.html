<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currentscy Picks</title></head><body style="background:#081426;color:white;font-family:system-ui"><p>Loading Currentscy Picks…</p><script>
(async()=>{try{
const files=Array.from({length:18},(_,i)=>`page-${String(i+1).padStart(2,'0')}.txt`);
const response=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
if(response.some(r=>!r.ok))throw Error('A website file could not be loaded');
let html=(await Promise.all(response.map(r=>r.text()))).join('');
html=html.replace(/(?:href|src)="assets\/(style-\d+\.css|script-\d+\.js)"/g,(match,file)=>match.replace('assets/',''));
document.open();document.write(html);document.close();
}catch(e){document.body.textContent='Unable to load Currentscy Picks: '+e.message;}})();
</script></body></html>
