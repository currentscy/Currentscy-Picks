me',sport:'nfl',game:0,tab:'Prediction',sportTab:'Top 5 Winners'};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){return '<section class="heading"><h1>Choose Your Sport</h1><p class="muted">Live matchups, research &amp; matchup-based predictions</p><div class="goldline"></div></section><section class="sports">'+sports.map(s=>'<button class="sport" style="--accent:'+s.color+'" data-sport="'+s.id+'"><span class="emoji">'+s.emoji+'</span><span><strong>'+s.name+'</strong><small>'+s.cadence+'</small></span><span class="chev">›</span></button>').join('')+'</section><section class="panel"><h2>🏆 Today’s Top Picks</h2><div class="quick">'+['nfl','nba','ncaa'].map(id=>'<button data-sport="'+id+'">'+sports.find(s=>s.id===id).emoji+' '+sports.find(s=>s.id===id).name+'<br><small>Top 5 Winners</small></button>').join('')+'</div></section><p class="note">Live schedules where available. Verified predictions are pending integration.</p>'}
function sportPage(){const sp=getSport(),games=scheduleCache[sp.id]||[],health=scheduleHealth[sp.id];const ranked=games.filter(g=>Number.isFinite(predictionCache[sp.id]?.[g.id]?.winProbability)).sort((a,b)=>predictionCache[sp.id][b.id].winProbability-predictionCache[sp.id][a.id].winProbability).slice(0,5);const shown=state.sportTab==='Top 5 Winners'?ranked:games;return '<nav class="nav"><button data-home>⌂ Home</button>'+sports.map(x=>'<button data-sport="'+x.id+'" class="'+(x.id===sp.id?'active':'')+'">'+x.emoji+' '+x.name+'</button>').join('')+'</nav><section class="hero" style="--accent:'+sp.color+'"><strong>'+sp.emoji+' '+sp.name+'</strong><span>Predictions · Matchups · Player Picks · Game Analysis</span></section><div class="tabs">'+['All Games','Top 5 Winners','Player Picks','Trends'].map(t=>'<button data-stab="'+t+'" class="'+(state.sportTab===t?'active':'')+'">'+t+'</button>').join('')+'</div><h2 class="section-title">'+sp.name+' · '+esc(state.sportTab)+'</h2><p class="subtitle" id="status">Next 14 days · chronological order · verified forecasts only</p>'+((state.sportTab==='All Games'||state.sportTab==='Top 5 Winners')?(!shown.length?'<section class="panel">No games or verified probability-ranked forecasts available for this selection.</section>':shown.map((g,i)=>'<button class="game-row" data-game="'+esc(g.id)+'"><div class="rowtop"><span class="rank">'+(i+1)+'</span><span class="team">'+esc(g.name)+'<div class="date">'+esc(new Date(g.date).toLocaleString())+' · '+esc(g.status)+'</div></span><span class="prob">'+(state.sportTab==='Top 5 Winners'?(predictionCache[sp.id]?.[g.id]?.winProbability*100).toFixed(1)+'%':'View →')</span></div></button>').join('')):'<section class="panel">Verified '+esc(state.sportTab.toLowerCase())+' evidence is not yet connected. No fabricated projections.</section>')+'<p class="note">Schedules cover the next 14 calendar days and are sorted by kickoff. Top 5 ranks only verified probability forecasts; uncalibrated scores are excluded. Missing days or unsupported feeds are reported.</p>'}function gamePage(){const sp=getSport(),g=(scheduleCache[sp.id]||[]).find(x=>x.id===state.game);if(!g)return '<button class="back" data-sport="'+sp.id+'">‹ Back</button><section class="panel">Game unavailable</section>';const cs=g.competitors||[],away=cs.find(x=>x.homeAway==='away')||cs[0]||{},home=cs.find(x=>x.homeAway==='home')||cs[1]||{},name=x=>x.team?.displayName||'Unknown team',logo=x=>x.team?.logo?'<img alt="" style="width:58px;height:58px;object-fit:contain" src="'+esc(x.team.logo)+'">':'🏆';return '<button class="back" data-sport="'+sp.id+'">‹ All '+sp.name+' Games</button><section class="versus" style="--left:'+sp.color+';--right:#07505d"><div class="center">'+logo(away)+'<br><strong>'+esc(name(away))+'</strong></div><div class="center"><strong>VS</strong><br><small>'+esc(new Date(g.date).toLocaleString())+'</small></div><div class="center">'+logo(home)+'<br><strong>'+esc(name(home))+'</strong></div></section><div class="tabs">'+['Prediction','Matchup','Players','Injuries','Stats'].map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'">'+t+'</button>').join('')+'</div><section class="panel"><h2>'+esc(state.tab)+'</h2><p>Game ID: '+esc(g.id)+'</p><p>Schedule status: '+esc(g.status)+'</p><p>Verified player evidence, injuries, matchup analysis and calibrated predictions will appear here after their adapters are connected.</p><p class="note">No invented win probabilities or projected scores.</p></section><section class="panel"><h2>5-Leg Player Parlay</h2><p>Awaiting verified records for both teams.</p></section>'}function render(){document.getElementById('view').innerHTML=state.page==='home'?home():state.page==='sport'?sportPage():gamePage();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{state.page='home';render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;state.page='sport';state.sportTab='All Games';render();fetchSchedule(state.sport).then(result=>{scheduleCache[state.sport]=result.games;scheduleHealth[state.sport]=result;render();const el=document.getElementById('status');if(el&&result.failedDays.length)el.textContent+=' · '+result.failedDays.length+' date requests failed (partial schedule)';}).catch(e=>{const el=document.getElementById('status');if(el)el.textContent='Schedule unavailable: '+e.message})});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=b.dataset.game;state.page='game';state.tab='Prediction';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{state.sportTab=b.dataset.stab;render()});}
try{render()}catch(error){document.getElementById('view').insertAdjacentHTML('afterbegin','<p class="note">Interactive data is temporarily unavailable.</p>');console.error(error)}
</script></body></html>
