<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050609"><title>Currentscy Picks</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f6f7fb;background:#050609;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#2c210d 0,transparent 38%),#050609;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f8d16a;outline-offset:3px}.shell{max-width:780px;margin:auto;min-height:100vh;padding:14px 13px 34px}.frame{border:1px solid #b98a28;border-radius:24px;box-shadow:0 0 20px #9c671b30, inset 0 0 0 1px #f2b82c33;padding:15px;background:linear-gradient(145deg,#080a0d,#050608)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #9d792e;padding:6px 0 17px;margin-bottom:17px}.brand{font-size:clamp(19px,4.5vw,29px);font-weight:850;letter-spacing:-1px;font-style:italic}.brand em{color:#f7b52d;font-style:italic}.brandmark{font-size:11px;line-height:1.1;letter-spacing:1.5px;color:#f3c15b;font-weight:900;border-bottom:2px solid #c89528;padding:3px;min-width:67px;text-align:center}.beta{border:1px solid #ad832b;border-radius:24px;font-size:9px;padding:7px;white-space:nowrap}.heading{text-align:center;padding:12px 0 23px;background:linear-gradient(140deg,#131720,#06080c);border-radius:18px;margin-bottom:16px}.heading h1{font-size:clamp(25px,6vw,36px);font-style:italic;margin:2px}.muted{color:#adb3c0}.heading p{margin:5px;font-size:13px}.goldline{width:120px;height:2px;background:linear-gradient(90deg,transparent,#ffc74b,transparent);margin:16px auto 0}.sports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sport{display:flex;align-items:center;gap:11px;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,#12151d),#11141a 72%);border:1px solid #49505e;border-left:2px solid var(--accent);border-radius:17px;min-height:93px;padding:12px 10px;box-shadow:inset 0 0 20px color-mix(in srgb,var(--accent) 12%,transparent)}.sport .emoji{font-size:31px;flex:0 0 38px;text-align:center}.sport strong{font-size:clamp(14px,3.4vw,19px);display:block}.sport small{color:#abb2c0;font-size:12px}.chev{margin-left:auto;color:#edb64e}.panel{background:linear-gradient(145deg,#1b2029,#0e1117);border:1px solid #5a4b30;border-radius:17px;padding:14px;margin-top:17px}.panel h2{font-size:19px;margin:0 0 10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{border:0;border-right:1px solid #67532c;background:none;padding:8px 3px;font-size:12px}.quick button:last-child{border:0}.back{background:linear-gradient(#242932,#11141a);border:1px solid #414a59;border-radius:14px;padding:11px 15px;margin-bottom:15px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px;scrollbar-width:none}.nav button,.tabs button{background:linear-gradient(#252b35,#0b0d11);border:1px solid #3e4653;border-radius:25px;padding:11px 15px;white-space:nowrap;font-size:13px;font-weight:700}.nav .active,.tabs .active{border-color:#1bafff;box-shadow:0 0 12px #007dff;color:white;background:linear-gradient(#0759a2,#071426)}.hero{border-radius:18px;min-height:154px;padding:23px 19px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 55%,#071222),#061020 80%);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero:after{content:' ';position:absolute;right:-60px;top:-50px;width:220px;height:220px;border:30px solid #ffffff0b;transform:rotate(45deg)}.hero strong{font-size:34px;font-style:italic;z-index:1}.hero span{font-size:13px;z-index:1}.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0;scrollbar-width:none}.section-title{font-size:19px;font-weight:800;margin:8px 0 3px}.subtitle{color:#adb5c5;font-size:12px;margin:0 0 12px}.game-row{width:100%;text-align:left;background:linear-gradient(120deg,#222935,#11151c);border:1px solid #394453;border-radius:16px;margin:10px 0;padding:12px}.rowtop{display:flex;align-items:center;gap:10px}.rank{border:1px solid #d7a22b;border-radius:8px;color:#ffd05c;font-size:20px;font-weight:900;padding:4px 9px}.team{font-weight:800;font-size:15px;flex:1}.date{font-size:12px;color:#b6bfce;margin-top:3px}.score{border-top:1px solid #364150;margin-top:10px;padding-top:9px;color:#cbd3df;font-size:12px}.prob{color:#f7c45e;font-weight:800;font-size:12px}.versus{display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(120deg,var(--left),#082347 45%,var(--right));border-radius:17px;padding:26px 12px;min-height:174px}.versus .logo{font-size:50px}.versus strong{font-size:20px}.versus small{font-size:12px;color:#e5e9f2}.center{text-align:center}.result{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.result .panel{margin:0;padding:13px}.result strong{font-size:20px}.winner{border-color:#1589df!important;background:linear-gradient(130deg,#064d91,#0b1829)!important}.gold{color:#f4c25a}.scoreboard{display:flex;justify-content:space-around;align-items:center;gap:10px;margin-top:8px}.scoreboard span{padding:10px;border-radius:9px;background:#11243c;font-weight:900;font-size:22px}.analysis{padding-left:21px;line-height:1.55;font-size:14px}.analysis li{margin:8px 0}.note{font-size:12px;color:#c3a66a;line-height:1.5;margin:14px 0}.hidden{display:none!important}@media(max-width:430px){.shell{padding:8px}.frame{padding:11px}.sport{min-height:80px;gap:6px}.sport .emoji{font-size:25px;flex-basis:31px}.sport strong{font-size:13px}.brand{font-size:20px}.beta{font-size:8px}.team{font-size:13px}.versus .logo{font-size:38px}.result strong{font-size:17px}}

/* Responsive V2 layout: viewport-fit home, no horizontal page overflow */
html,body{width:100%;max-width:100%;overflow-x:clip} .shell,.frame,#view{min-width:0;width:100%} .nav,.tabs{max-width:100%;overscroll-behavior-x:contain} .sport,.game-row,.panel{min-width:0} .sport>span:nth-child(2){min-width:0} .sport strong{overflow-wrap:anywhere} .team{min-width:0;overflow-wrap:anywhere} .brand{min-width:0;white-space:nowrap} .versus>*{min-width:0} .versus strong{overflow-wrap:anywhere}
@media(max-width:600px){.shell{padding:7px 8px 12px}.frame{padding:10px;border-radius:20px}header{padding:3px 0 9px;margin-bottom:10px;gap:5px}.brandmark{min-width:55px;font-size:9px;letter-spacing:.5px}.brand{font-size:clamp(15px,4.2vw,21px);letter-spacing:-.7px}.beta{font-size:7px;padding:6px 5px}.heading{padding:7px 3px 10px;margin-bottom:10px}.heading h1{font-size:clamp(23px,6vw,32px)}.heading p{font-size:clamp(10px,2.8vw,13px)}.goldline{margin:8px auto 0}.sports{gap:8px}.sport{min-height:clamp(59px,9.2dvh,80px);padding:7px 8px;border-radius:14px}.sport .emoji{font-size:clamp(22px,6vw,30px);flex-basis:30px}.sport strong{font-size:clamp(12px,3.4vw,16px)}.sport small{font-size:clamp(10px,2.8vw,12px)}.panel{margin-top:10px;padding:10px}.panel h2{font-size:17px}.quick{gap:2px}.quick button{font-size:11px;padding:5px 2px}.quick small{font-size:10px}.note{font-size:10px;margin:8px 0}.hero{min-height:125px;padding:17px 13px}.nav button,.tabs button{padding:9px 12px}.versus{padding:18px 8px;min-height:145px}}
@media(max-width:600px) and (max-height:740px){.sport{min-height:55px}.heading{padding:4px 2px 6px}.heading h1{margin:0}.goldline{margin-top:5px}.sports{gap:6px}.panel{margin-top:7px}.note{margin:5px 0}}

/* Unified compact black, silver and gold branding */
:root{--gold:#d5a635;--silver:#f1f2f4}body{background:#030303;color:var(--silver)}.shell{max-width:900px;padding:8px 10px 14px}.frame{background:#050505;border:1px solid #5b4820;box-shadow:none;padding:12px;border-radius:16px}header{justify-content:center;border-color:#6c5525;margin-bottom:9px;padding:5px 0 10px}.brand{font-weight:900;font-style:italic;text-align:center;font-size:clamp(17px,4.7vw,30px);color:#eee;letter-spacing:-.8px}.brand em{color:#dcb34e}.brand .currency{color:#e5b63e}.heading{background:transparent;padding:4px 0 10px;margin-bottom:8px}.heading h1{font-size:clamp(20px,5.3vw,30px);font-style:normal}.heading p{font-size:clamp(10px,2.8vw,13px)}.goldline{margin:7px auto 0}.sports{gap:7px}.sport{min-height:65px;padding:7px;border:1px solid #3d3c3a;border-left:2px solid var(--accent);border-radius:12px;background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 13%,#111),#0d0d0f 85%);box-shadow:none}.sport .emoji{font-size:24px;flex-basis:27px}.sport strong{font-size:clamp(11px,3.1vw,16px)}.sport small{font-size:clamp(9px,2.5vw,11px)}.panel{background:#111113;border:1px solid #5c4a2d;margin-top:9px;padding:10px}.panel h2{font-size:clamp(15px,4vw,19px)}.quick button{font-size:clamp(10px,2.6vw,13px)}.note{font-size:10px;margin:6px 0}.nav .active,.tabs .active{border-color:var(--gold);background:#342710;box-shadow:none}.winner{border-color:var(--gold)!important;background:#211a0d!important}@media(max-width:600px){.shell{padding:5px}.frame{padding:9px}.sport{min-height:clamp(55px,8dvh,70px)}.sports{gap:7px}.heading{padding:4px 0 8px}.heading h1{margin:0}.panel{margin-top:8px}}
</style></head><body><main class="shell"><div class="frame"><header><div class="brand" aria-label="Currentscy Picks">CURRENT<span class="currency">＄</span>CY <em>PICKS</em></div></header><div id="view"></div></div></main>
<script>
const sports=[{id:'nfl',name:'NFL',emoji:'🏈',color:'#0078ef',cadence:'Weekly Picks'},{id:'nba',name:'NBA',emoji:'🏀',color:'#a42bda',cadence:'Daily Picks'},{id:'ncaa',name:'NCAA Football',emoji:'🏈',color:'#ed304c',cadence:'Weekly Picks'},{id:'nhl',name:'NHL',emoji:'🏒',color:'#a4b0c0',cadence:'Daily Picks'},{id:'mlb',name:'MLB',emoji:'⚾',color:'#237bdc',cadence:'Daily Picks'},{id:'soccer',name:'Soccer',emoji:'⚽',color:'#1cba51',cadence:'Daily Picks'},{id:'tennis',name:'Tennis',emoji:'🎾',color:'#b0e12a',cadence:'Daily Picks'},{id:'ufc',name:'UFC',emoji:'🥊',color:'#e63838',cadence:'Fight Picks'}];
const examples={nfl:[['Buffalo Bills','Miami Dolphins','BUF','MIA'],['Kansas City Chiefs','Arizona Cardinals','KC','ARI'],['Chicago Bears','New Orleans Saints','CHI','NO'],['Detroit Lions','Tampa Bay Buccaneers','DET','TB'],['Denver Broncos','Las Vegas Raiders','DEN','LV']],nba:[['Boston Celtics','New York Knicks','BOS','NYK'],['Los Angeles Lakers','Golden State Warriors','LAL','GSW']],ncaa:[['Ohio State','Michigan','OSU','MICH']],nhl:[['New York Rangers','Boston Bruins','NYR','BOS']],mlb:[['Los Angeles Dodgers','San Diego Padres','LAD','SD']],soccer:[['Arsenal','Chelsea','ARS','CHE']],tennis:[['Player A','Player B','A','B']],ufc:[['Fighter A','Fighter B','A','B']]};
let state={page:'home',sport:'nfl',game:0,tab:'Prediction',sportTab:'Top 5 Winners'};
const getSport=()=>sports.find(s=>s.id===state.sport);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){return '<section class="heading"><h1>Choose Your Sport</h1><p class="muted">Live matchups, research &amp; matchup-based predictions</p><div class="goldline"></div></section><section class="sports">'+sports.map(s=>'<button class="sport" style="--accent:'+s.color+'" data-sport="'+s.id+'"><span class="emoji">'+s.emoji+'</span><span><strong>'+s.name+'</strong><small>'+s.cadence+'</small></span><span class="chev">›</span></button>').join('')+'</section><section class="panel"><h2>🏆 Today’s Top Picks</h2><div class="quick">'+['nfl','nba','ncaa'].map(id=>'<button data-sport="'+id+'">'+sports.find(s=>s.id===id).emoji+' '+sports.find(s=>s.id===id).name+'<br><small>Top 5 Winners</small></button>').join('')+'</div></section><p class="note">Design preview. Live fixtures and predictions are not connected on this preview page.</p>'}
function sportPage(){const s=getSport(),games=examples[s.id];return '<nav class="nav"><button data-home>⌂ Home</button>'+sports.map(x=>'<button data-sport="'+x.id+'" class="'+(x.id===s.id?'active':'')+'">'+x.emoji+' '+x.name+'</button>').join('')+'</nav><section class="hero" style="--accent:'+s.color+'"><strong>'+s.emoji+' '+s.name+'</strong><span>Predictions · Matchups · Player Picks · Game Analysis</span></section><div class="tabs">'+['Top 5 Winners','All Games','Player Picks','Trends'].map(t=>'<button data-stab="'+t+'" class="'+(state.sportTab===t?'active':'')+'">'+t+'</button>').join('')+'</div><h2 class="section-title">🏆 '+s.name+' · '+esc(state.sportTab)+'</h2><p class="subtitle">Interactive layout preview · illustrative matchups only</p>'+ (state.sportTab==='Top 5 Winners'||state.sportTab==='All Games'?games.map((g,i)=>'<button class="game-row" data-game="'+i+'"><div class="rowtop"><span class="rank">'+(i+1)+'</span><span class="team">'+esc(g[0])+' vs '+esc(g[1])+'<div class="date">📅 Schedule pending live source</div></span><span class="prob">View →</span></div><div class="score">Projected score: awaiting verified simulation &nbsp; | &nbsp; Key edge: awaiting matchup evidence</div></button>').join(''):'<section class="panel">Live '+esc(state.sportTab.toLowerCase())+' will appear here after connecting verified data sources.</section>')+'<p class="note">The displayed pairings are design placeholders, not confirmed upcoming games or recommended picks.</p>'}
function gamePage(){const s=getSport(),g=(examples[s.id]||examples.nfl)[state.game]||examples.nfl[0];return '<button class="back" data-sport="'+s.id+'">‹ All '+s.name+' Games</button><section class="versus" style="--left:'+s.color+';--right:#086f79"><div class="center"><div class="logo">'+s.emoji+'</div><strong>'+esc(g[2])+'</strong></div><div class="center"><strong>vs</strong><br><small>Schedule pending</small></div><div class="center"><div class="logo">🛡️</div><strong>'+esc(g[3])+'</strong></div></section><h2 class="center">'+esc(g[0])+' vs '+esc(g[1])+'</h2><div class="tabs">'+['Prediction','Matchup','Players','Injuries','Stats'].map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'">'+t+'</button>').join('')+'</div>'+(state.tab==='Prediction'?'<section class="result"><div class="panel winner"><small>🏆 Predicted Winner</small><br><strong>Awaiting verified data</strong></div><div class="panel"><small>Win Probability</small><br><strong class="gold">Unavailable</strong></div></section><section class="panel"><div>Projected Final Score</div><div class="scoreboard"><span>'+esc(g[2])+' —</span><b>–</b><span>'+esc(g[3])+' —</span></div></section><section class="panel"><h2>📊 Matchup Analysis</h2><ul class="analysis"><li>Starting players and availability: awaiting current-season verification</li><li>Offensive and defensive matchup: awaiting source evidence</li><li>Coaching tendencies and tactical advantages: not yet assessed</li><li>Predictions remain unavailable until both teams’ records are linked</li></ul></section><section class="panel" style="border-color:#b98a28"><h2>🎯 Game-Specific Player Picks</h2><p class="muted">Requires verified player data and supported Kalshi selections.</p></section>':'<section class="panel"><h2>'+esc(state.tab)+'</h2><p class="muted">This section will use current-season, game-specific verified data from existing providers. No statistics or injuries are invented in the preview.</p></section>')+'<p class="note">Visual preview only. No live forecasts, scores or probabilities are claimed.</p>'}
function render(){document.getElementById('view').innerHTML=state.page==='home'?home():state.page==='sport'?sportPage():gamePage();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{state.page='home';render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;state.page='sport';state.sportTab='Top 5 Winners';render()});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=Number(b.dataset.game);state.page='game';state.tab='Prediction';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{state.sportTab=b.dataset.stab;render()});}
render();
</script></body></html>
