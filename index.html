<style>:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f7f8fb;background:#030303;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{background:#030303;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f8d16a;outline-offset:3px}.shell{width:100%;max-width:780px;margin:auto;padding:8px}.frame{min-height:90vh;border:1px solid #a47b2e;border-radius:24px;background:#030303;padding:12px;box-shadow:0 0 16px #ad7e2915}header{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #8d6c2e;padding:4px 0 17px;margin-bottom:17px;min-height:84px}.official-logo{width:clamp(115px,30vw,170px);max-height:92px;height:auto;object-fit:contain;display:block;flex-shrink:1;min-width:0}.brand{display:none}.build-meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}.beta{border:1px solid #ad832b;border-radius:24px;font-size:9px;padding:8px 10px;white-space:nowrap}.build-number{font-size:10px;letter-spacing:1.2px;color:#f4c35b;font-weight:800;white-space:nowrap}.heading{text-align:center;padding:21px 8px 24px;background:radial-gradient(ellipse at 50% 50%,#241607,#0c0d10 75%);border-radius:20px;margin-bottom:17px}.heading h1{font-size:clamp(24px,6vw,37px);font-style:italic;line-height:1.12;margin:4px 0 12px}.heading p{font-size:clamp(11px,3vw,15px);margin:0}.muted,.subtitle{color:#adb4c2}.goldline{width:120px;height:2px;background:linear-gradient(90deg,transparent,#eab847,transparent);margin:18px auto 0}.sports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.sport{--accent:#bd903c;display:flex;align-items:center;gap:9px;min-width:0;text-align:left;background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 23%,#11141a),#11151c 83%);border:1px solid #454c59;border-left:3px solid var(--accent);border-radius:20px;min-height:82px;padding:10px 11px}.sport .emoji{font-size:clamp(24px,6vw,34px <script>
const sports=[{id:'nfl',name:'NFL',emoji:'🏈',color:'#0078ef',cadence:'Weekly Picks'},{id:'nba',name:'NBA',emoji:'🏀',color:'#a42bda',cadence:'Daily Picks'},{id:'ncaa',name:'NCAA Football',emoji:'🏈',color:'#ed304c',cadence:'Weekly Picks'},{id:'nhl',name:'NHL',emoji:'🏒',color:'#a4b0c0',cadence:'Daily Picks'},{id:'mlb',name:'MLB',emoji:'⚾',color:'#237bdc',cadence:'Daily Picks'},{id:'soccer',name:'Soccer',emoji:'⚽',color:'#1cba51',cadence:'Daily Picks'},{id:'tennis',name:'Tennis',emoji:'🎾',color:'#b0e12a',cadence:'Daily Picks'},{id:'ufc',name:'UFC',emoji:'🥊',color:'#e63838',cadence:'Fight Picks'}];
const examples={nfl:[['Buffalo Bills','Miami Dolphins','BUF','MIA'],['Kansas City Chiefs','Arizona Cardinals','KC','ARI'],['Chicago Bears','New Orleans Saints','CHI','NO'],['Detroit Lions','Tampa Bay Buccaneers','DET','TB'],['Denver Broncos','Las Vegas Raiders','DEN','LV']],nba:[['Boston Celtics','New York Knicks','BOS','NYK'],['Los Angeles Lakers','Golden State Warriors','LAL','GSW']],ncaa:[['Ohio State','Michigan','OSU','MICH']],nhl:[['New York Rangers','Boston Bruins','NYR','BOS']],mlb:[['Los Angeles Dodgers','San Diego Padres','LAD','SD']],soccer:[['Arsenal','Chelsea','ARS','CHE']],tennis:[['Player A','Player B','A','B']],ufc:[['Fighter A','Fighter B','A','B']]};
sports.push({id:'ncaab',name:'NCAA Basketball',emoji:'🏀',color:'#c67b20',cadence:'Daily Picks'});const adapters={nfl:'football/nfl',nba:'basketball/nba',ncaa:'football/college-football',ncaab:'basketball/mens-college-basketball',nhl:'hockey/nhl',mlb:'baseball/mlb',soccer:'soccer/eng.1'};const scheduleCache={};const scheduleHealth={};const predictionCache={};const phaseInterfaces=['ingestion','source-validation','identity-reconciliation','evidence-ledger','features','simulation','calibration','forecast-archive','monitoring','promotion'];async function fetchSchedule(id){if(!adapters[id])throw Error('No schedule provider connected for '+id);const today=new Date();today.setHours(0,0,0,0);const dates=Array.from({length:14},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i);return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')});const groups=[];for(let i=0;i<dates.length;i+=4){const batch=dates.slice(i,i+4);groups.push(...await Promise.all(batch.map(async date=>{const url='https://site.api.espn.com/apis/site/v2/sports/'+adapters[id]+'/scoreboard?dates='+date+'&limit=500';try{const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();return {date,events:json.events||[],ok:true}}catch(e){return {date,events:[],ok:false,error:e.message}}})));}const failed=groups.filter(g=>!g.ok);if(failed.length===groups.length)throw Error('All 14 schedule requests failed');const unique=new Map();for(const group of groups)for(const e of group.events){if(!e.id||!e.date)continue;const t=new Date(e.date);if(t<today||t>=new Date(today.getTime()+15*86400000))continue;unique.set(String(e.id),{id:String(e.id),name:e.name,date:e.date,status:e.status?.type?.description||'Scheduled',competitors:e.competitions?.[0]?.competitors||[]})}return {games:[...unique.values()].sort((a,b)=>new Date(a.date)-new Date(b.date)),failedDays:failed.map(g=>g.date),requestedDays:14}}let state={page:'home',sport:'nfl',game:0,tab:'Prediction',sportTab:'Top 5 Winners'};
const getSport=()=>sports.find(s=>s.id===state.sport);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){return '<section class="heading"><h1>Choose Your Sport</h1><p class="muted">Live matchups, research &amp; matchup-based predictions</p><div class="goldline"></div></section><section class="sports">'+sports.map(s=>'<button class="sport" style="--accent:'+s.color+'" data-sport="'+s.id+'"><span class="emoji">'+s.emoji+'</span><span><strong>'+s.name+'</strong><small>'+s.cadence+'</small></span><span class="chev">›</span></button>').join('')+'</section><section class="panel"><h2>🏆 Today’s Top Picks</h2><div class="quick">'+['nfl','nba','ncaa'].map(id=>'<button data-sport="'+id+'">'+sports.find(s=>s.id===id).emoji+' '+sports.find(s=>s.id===id).name+'<br><small>Top 5 Winners</small></button>').join('')+'</div></section><p class="note">Live schedules where available. Verified predictions are pending integration.</p>'}
function sportPage(){const sp=getSport(),games=scheduleCache[sp.id]||[],health=scheduleHealth[sp.id];const ranked=games.filter(g=>Number.isFinite(predictionCache[sp.id]?.[g.id]?.winProbability)).sort((a,b)=>predictionCache[sp.id][b.id].winProbability-predictionCache[sp.id][a.id].winProbability).slice(0,5);const shown=state.sportTab==='Top 5 Winners'?ranked:games;return '<nav class="nav"><button data-home>⌂ Home</button>'+sports.map(x=>'<button data-sport="'+x.id+'" class="'+(x.id===sp.id?'active':'')+'">'+x.emoji+' '+x.name+'</button>').join('')+'</nav><section class="hero" style="--accent:'+sp.color+'"><strong>'+sp.emoji+' '+sp.name+'</strong><span>Predictions · Matchups · Player Picks · Game Analysis</span></section><div class="tabs">'+['All Games','Top 5 Winners','Player Picks','Trends'].map(t=>'<button data-stab="'+t+'" class="'+(state.sportTab===t?'active':'')+'">'+t+'</button>').join('')+'</div><h2 class="section-title">'+sp.name+' · '+esc(state.sportTab)+'</h2><p class="subtitle" id="status">Next 14 days · chronological order · verified forecasts only</p>'+((state.sportTab==='All Games'||state.sportTab==='Top 5 Winners')?(!shown.length?'<section class="panel">No games or verified probability-ranked forecasts available for this selection.</section>':shown.map((g,i)=>'<button class="game-row" data-game="'+esc(g.id)+'"><div class="rowtop"><span class="rank">'+(i+1)+'</span><span class="team">'+esc(g.name)+'<div class="date">'+esc(new Date(g.date).toLocaleString())+' · '+esc(g.status)+'</div></span><span class="prob">'+(state.sportTab==='Top 5 Winners'?(predictionCache[sp.id]?.[g.id]?.winProbability*100).toFixed(1)+'%':'View →')</span></div></button>').join('')):'<section class="panel">Verified '+esc(state.sportTab.toLowerCase())+' evidence is not yet connected. No fabricated projections.</section>')+'<p class="note">Schedules cover the next 14 calendar days and are sorted by kickoff. Top 5 ranks only verified probability forecasts; uncalibrated scores are excluded. Missing days or unsupported feeds are reported.</p>'}function gamePage(){const sp=getSport(),g=(scheduleCache[sp.id]||[]).find(x=>x.id===state.game);if(!g)return '<button class="back" data-sport="'+sp.id+'">‹ Back</button><section class="panel">Game unavailable</section>';const cs=g.competitors||[],away=cs.find(x=>x.homeAway==='away')||cs[0]||{},home=cs.find(x=>x.homeAway==='home')||cs[1]||{},name=x=>x.team?.displayName||'Unknown team',logo=x=>x.team?.logo?'<img alt="" style="width:58px;height:58px;object-fit:contain" src="'+esc(x.team.logo)+'">':'🏆';return '<button class="back" data-sport="'+sp.id+'">‹ All '+sp.name+' Games</button><section class="versus" style="--left:'+sp.color+';--right:#07505d"><div class="center">'+logo(away)+'<br><strong>'+esc(name(away))+'</strong></div><div class="center"><strong>VS</strong><br><small>'+esc(new Date(g.date).toLocaleString())+'</small></div><div class="center">'+logo(home)+'<br><strong>'+esc(name(home))+'</strong></div></section><div class="tabs">'+['Prediction','Matchup','Players','Injuries','Stats'].map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'">'+t+'</button>').join('')+'</div><section class="panel"><h2>'+esc(state.tab)+'</h2><p>Game ID: '+esc(g.id)+'</p><p>Schedule status: '+esc(g.status)+'</p><p>Verified player evidence, injuries, matchup analysis and calibrated predictions will appear here after their adapters are connected.</p><p class="note">No invented win probabilities or projected scores.</p></section><section class="panel"><h2>5-Leg Player Parlay</h2><p>Awaiting verified records for both teams.</p></section>'}function render(){document.getElementById('view').innerHTML=state.page==='home'?home():state.page==='sport'?sportPage():gamePage();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{state.page='home';render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;state.page='sport';state.sportTab='All Games';render();fetchSchedule(state.sport).then(result=>{scheduleCache[state.sport]=result.games;scheduleHealth[state.sport]=result;render();const el=document.getElementById('status');if(el&&result.failedDays.length)el.textContent+=' · '+result.failedDays.length+' date requests failed (partial schedule)';}).catch(e=>{const el=document.getElementById('status');if(el)el.textContent='Schedule unavailable: '+e.message})});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=b.dataset.game;state.page='game';state.tab='Prediction';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{state.sportTab=b.dataset.stab;render()});}
try{render()}catch(error){document.getElementById('view').insertAdjacentHTML('afterbegin','<p class="note">Interactive data is temporarily unavailable.</p>');console.error(error)}
</script></body></html>
