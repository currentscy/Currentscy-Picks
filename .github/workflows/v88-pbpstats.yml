name: V88 NBA pbpstats research
on:
  workflow_dispatch:
    inputs:
      game_ids:
        description: 'Completed NBA game IDs, comma separated (up to 3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: v88-nba-pbpstats
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/v88-free-defender-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NBA_GAME_IDS: ${{ inputs.game_ids }}
      NBA_SEASON: '2026-27'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v88-free-defender-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pbpstats
      - run: python scripts/v88_pbpstats.py
      - name: Commit research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v88-pbpstats.json
          git diff --cached --quiet || (git commit -m "Refresh V88 pbpstats research snapshot" && git push)
