name: Currentscy Stage 1 multi-sport evidence collection
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/stage1-collection.yml'
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: currentscy-research-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check research scripts
        run: python -m compileall -q scripts
      - name: Test multi-sport pregame forecast gates
        run: python -m unittest discover -s scripts -p 'test_multisport_baseline.py'
      - name: Test normalization and source provenance
        run: python -m unittest discover -s scripts -p 'test_stage1_collector.py'
      - name: Test Stage 2 source reconciliation
        run: python -m unittest discover -s scripts -p 'test_stage2_reconcile.py'
      - name: Test Stage 3 pregame evaluation gates
        run: python -m unittest discover -s scripts -p 'test_stage3_evaluate.py'
      - name: Test Stage 4 paired model audit
        run: python -m unittest discover -s scripts -p 'test_stage4_audit.py'
      - name: Test Stage 5 evidence archive
        run: python -m unittest discover -s scripts -p 'test_stage5_archive.py'
      - name: Test unified research consistency
        run: python -m unittest discover -s scripts -p 'test_research_consistency.py'
      - name: Test persistent multisport event history
        run: python -m unittest discover -s scripts -p 'test_unified_event_ledger.py'
      - name: Test unified validation gates
        run: python -m unittest discover -s scripts -p 'test_validation_dashboard.py'
      - name: Collect scoreboard snapshots
        run: python scripts/stage1_collect.py
      - name: Collect persistent multisport match and fight ledger
        run: python scripts/unified-event-ledger.py
      - name: Bootstrap real historical final scores once
        run: |
          if [ ! -f research-ledger/history-bootstrap.json ]; then
            python scripts/history-bootstrap.py
          else
            echo 'Historical result bootstrap already saved; skip backfill'
          fi
      - name: Refresh legacy multisport research (same pipeline)
        run: python scripts/multisport-refresh.py
      - name: Refresh legacy NFL and NCAA audit (same pipeline)
        run: python scripts/automatic-research.py
      - name: Capture pregame non-NBA research baselines and final outcomes
        run: python scripts/multisport-baseline.py
      - name: Preserve pregame and final-score source snapshots
        run: python scripts/stage5_archive.py
      - name: Reconcile source identities and provenance
        run: python scripts/stage2_reconcile.py
      - name: Evaluate archived pregame predictions (no live activation)
        run: python scripts/stage3_evaluate.py
      - name: Audit paired model results by sport and month (offline only)
        run: python scripts/stage4_audit.py
      - name: Audit whether each sport has pregame forecasts and final results
        run: python scripts/validation_dashboard.py
      - name: Cross-check all research layers
        run: python scripts/research_consistency.py
      - name: Publish verifiable workflow heartbeat
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: python scripts/workflow-verification.py
      - name: Save latest evidence snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-ledger/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh unified research and feedback evidence"
            git pull --rebase
            git push
          fi
