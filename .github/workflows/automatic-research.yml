name: Currentscy Picks automatic research collection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: currentscy-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect games and audit pregame evidence
        run: python scripts/automatic-research.py
      - name: Commit research ledger only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-ledger/
          if ! git diff --cached --quiet; then
            git commit -m "Update automated NFL and NCAA research ledger"
            git push
          fi
