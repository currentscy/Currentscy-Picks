name: V95 Sportradar private NFL validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-nfl-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NFL feed without publishing licensed records
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_NFL_FEED_URL: ${{ vars.SPORTRADAR_NFL_FEED_URL }}
        run: python scripts/v95_sportradar_private.py
