name: Currentscy live NBA prediction feedback
on:
  push:
    paths:
      - 'scripts/**'
      - 'nba-shared-model.js'
      - 'v87-daily-three.js'
      - '.github/workflows/live-feedback.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: currentscy-research-write
  cancel-in-progress: false
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check source collectors
        run: |
          python -m compileall -q scripts
          node --check nba-shared-model.js
          node --check scripts/live-nba-feedback.cjs
      - name: Test exact shared NBA model and outcome extraction
        run: node --test scripts/test-live-nba-feedback.cjs
      - name: Test feedback evaluation and research audit
        run: |
          python -m unittest discover -s scripts -p 'test_stage3_evaluate.py'
          python -m unittest discover -s scripts -p 'test_stage4_audit.py'
          python -m unittest discover -s scripts -p 'test_research_consistency.py'
      - name: Capture actual pregame NBA model forecasts and completed outcomes
        run: node scripts/live-nba-feedback.cjs
      - name: Test immutable forecast settlement
        run: python -m unittest discover -s scripts -p 'test_settle_archived_forecasts.py'
      - name: Settle archived forecasts from completed multi-sport scoreboards
        run: python scripts/settle-archived-forecasts.py
      - name: Score live forecasts when source evidence is available
        run: |
          if [ -f research-ledger/stage2/latest.json ]; then
            python scripts/stage3_evaluate.py
            python scripts/stage4_audit.py
          else
            echo "Stage 2 snapshot not yet available; retaining predictions for later scoring"
          fi
          if [ -f research-ledger/unified-events.json ]; then
            python scripts/validation_dashboard.py
          fi
          python scripts/research_consistency.py
      - name: Test checkpoint-specific scoring and calibration\n        run: python -m unittest discover -s scripts -p 'test_checkpoint_evaluation.py'\n      - name: Evaluate checkpoint archives without changing live models\n        run: python scripts/checkpoint_evaluation.py\n      - name: Learn from finalized pregame predictions (shadow mode)
        run: |
          python scripts/learning_calibration.py
          python scripts/forecast_vs_results.py
      - name: Test AI research evidence gates
        run: python -m unittest discover -s scripts -p 'test_ai_research_agent.py'
      - name: AI research audit (optional, never changes forecasts)
        env:
          OPENAI_API_KEY: ''
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/ai-research-agent.py
      - name: Cross-check research with optional free-tier AI providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_AI_GATEWAY_URL: ${{ vars.CLOUDFLARE_AI_GATEWAY_URL }}
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
        run: python scripts/free-ai-crosscheck.py
      - name: Test cross-layer integration health
        run: python -m unittest discover -s scripts -p 'test_integration_health.py'
      - name: Integrate and audit every research layer
        if: always()
        run: python scripts/integration_health.py
      - name: Publish verifiable workflow heartbeat
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: python scripts/workflow-verification.py
      - name: Commit forecast history and feedback diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research-ledger/
          if ! git diff --cached --quiet; then
            git commit -m "Capture live NBA forecasts, outcomes and scoring feedback"
            git pull --rebase
            git push
          fi
