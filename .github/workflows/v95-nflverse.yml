name: V95 NFLverse player statistics
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: '2026'
  schedule:
    - cron: '35 11 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-nfl-multisource
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate nflverse weekly player stats
        env:
          NFL_SEASON: ${{ inputs.season || '2026' }}
        run: python scripts/v95_nflverse_ingest.py
      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v95-nflverse-player-stats.json
          git diff --cached --quiet || (git commit -m "Update V95 nflverse player history" && git push origin HEAD:v95-nfl-multisource)
