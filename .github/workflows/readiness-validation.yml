name: Readiness validation (isolated)
on:
  push:
    branches:
      - fix/stages-1-3-evidence-2026-11-21
    paths:
      - 'research-ledger/validation/**'
      - '.github/workflows/readiness-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated readiness regression tests
        run: node --test research-ledger/validation/build-readiness.test.mjs
      - name: Dry-run readiness report without publishing
        run: |
          node research-ledger/validation/build-readiness.mjs
          git diff -- research-ledger/validation-dashboard.json
