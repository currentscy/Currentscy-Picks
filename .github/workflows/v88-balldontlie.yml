name: V88 BALLDONTLIE free metadata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    if: github.ref == 'refs/heads/v88-free-defender-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v88-free-defender-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v88_balldontlie.py
      - name: Commit public metadata (never secrets)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v88-balldontlie.json
          git diff --cached --quiet || (git commit -m "Refresh V88 BALLDONTLIE metadata" && git push)
